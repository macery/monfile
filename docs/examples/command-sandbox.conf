# Example systemd drop-in for a folder batch whose `command` program needs more than
# monfile's default sandbox allows (DESIGN §6.4, ADR-0011). Installed for reference at
# /opt/monfile/docs/examples/command-sandbox.conf; it is NOT active until you copy it.
#
#   sudo install -D -m 0644 /opt/monfile/docs/examples/command-sandbox.conf \
#       /etc/systemd/system/monfile.service.d/command.conf
#   sudo systemctl edit monfile.service      # trim it to what the program really needs
#   sudo systemctl restart monfile.service
#
# Everything here also loosens monfile itself on this host. Keep only the lines the program
# needs, and record each one (and why) in the host's authorization package.
# Find out what it needs before go-live: point a test batch folder at a test copy of the
# program, drop a few files in, and read its COMMAND_OUTPUT / COMMAND_FAIL events:
#   journalctl -t monfile -f
# A program killed by the syscall filter ends with COMMAND_FAIL error="killed by SIGSYS".

[Service]
# The service's syscall filter KILLS a process (SIGSYS) that makes a blocked call, and the
# program inherits it. Blocked groups include @privileged (chown/fchown, setuid, setgroups, ...)
# and @resources (setrlimit, nice, setpriority, ...). Common tools hit them: gpg calls
# setrlimit to disable core dumps; rsync -a, cp -p and tar --same-owner call chown; nice and
# ionice. List them with:  systemd-analyze syscall-filter @privileged @resources
# Least change first: make blocked calls fail with EPERM instead of killing the process.
# Most tools treat that as "not permitted" and carry on.
#SystemCallErrorNumber=EPERM
# Only if the program really needs one of those calls to SUCCEED: reset the filter and allow
# the standard service set (this drops the ~@privileged ~@resources deny lists).
#SystemCallFilter=
#SystemCallFilter=@system-service

# The program reads keys or config under the service account's home (e.g. ~/.gnupg).
# "read-only" is enough for reading; tools that write lock or agent files there need "no".
#ProtectHome=read-only

# The program sends files over the network (scp, rsync, ssh, curl, ...).
#PrivateNetwork=no
#RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6

# Directories the program writes to, besides the watch folder (already in paths.conf):
# its staging, output, and log directories.
#ReadWritePaths=/data/xfer/outbound /var/log/wsus-xfer

# The program runs tools that JIT-compile or map executable memory (rare for shell tools).
#MemoryDenyWriteExecute=no

# Never needed and never allowed: the program cannot gain privileges (no sudo, no setuid)
# because NoNewPrivileges=yes stays in force. A program that needs root is out of scope.
