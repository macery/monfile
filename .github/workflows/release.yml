# Build the delivery tarball (ADR-0008) and publish a GitHub release when a
# v* tag is pushed. Tools used here are listed in THIRD_PARTY.md §3.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check tag matches __version__
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/monfile/__init__.py)"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} does not match __version__ ${version}" >&2; exit 1; }

      - name: Test
        run: PYTHONPATH=src python3 -m unittest discover -s tests

      - name: Build tarball
        run: ./packaging/build-tarball.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## [${version}]" 'index($0, h) == 1 {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG section for ${version}" >&2; exit 1; }
          prerelease=""
          case "$version" in 0.*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $prerelease \
            --title "monfile ${version}" --notes-file notes.md \
            "dist/monfile-${version}.tar.gz" dist/SHA256SUMS HOWTO.md
