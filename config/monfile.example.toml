# monfile configuration (reference / example)
# Install as /etc/monfile/monfile.toml, owner root:monfile, mode 0640.
# monfile refuses to start if this file is group/world-writable or not root-owned.
# Unknown keys are errors. See DESIGN.md §5 for the full schema and validation rules.

[global]
state_dir             = "/var/lib/monfile"            # state.db (SQLite) lives here
manifest_dir          = "/var/lib/monfile/manifests"  # per-file manifests, for folders with manifest = true
scan_interval_seconds = 30                            # how often each folder is polled
log_level             = "info"                        # debug | info | warning | error
syslog_facility       = "daemon"                      # syslog facility for audit events
hash_chunk_bytes      = 1048576                       # read size for SHA-256 hashing
max_files_per_cycle   = 1000                          # backpressure: max files evaluated per folder per cycle

# Each [[folder]] block adds one watched folder; [[folder.action]] adds an action to
# the folder above it. The section names are fixed keywords: [[inbound_patches]] is
# rejected as an unknown key. Name a folder with its `id` instead (it appears in logs,
# manifest paths, and `monfile status`/`retry`), and use a comment like the ones below
# as a visual label.
#
# `enabled = false` turns a folder off without deleting its block: it is still
# syntax-checked, but its directories are not checked or scanned. Both examples
# ship disabled so a copied example watches nothing until you edit it. After
# changing `enabled`, restart the service (there is no live reload).

# ---------------------------------------------------------------------------
# Folder 1: copy to an outbound share, keep a processed archive, manifests ON
# (useful during setup/debugging).
# ---------------------------------------------------------------------------
[[folder]]
id             = "inbound-a"              # ^[a-z0-9][a-z0-9_-]{0,63}$, unique; used in logs + manifest path
enabled        = false                    # true (default if omitted) = watch this folder
path           = "/data/inbound/a"        # absolute; no symlinks in any component
recursive      = false                    # true = also watch subdirectories
settle_seconds = 300                      # unchanged for this long before processing (>= 2 x scan interval)
verify_hash    = true                     # also require SHA-256 equal at start and end of settle window
skip_empty     = false                    # true = never process zero-byte files
manifest       = true                     # write a JSON manifest per processed file
include        = ["*"]                    # fnmatch on file basename
exclude        = [".*", "*.part", "*.tmp", "~$*", "*.crdownload", "*.filepart"]   # this is the default if omitted
on_success     = "move"                   # leave | move | delete  (applied only if all actions succeed)
processed_dir  = "/data/processed/a"      # required when on_success = "move"; must be outside `path`
# ready_marker = ".done"                  # optional: wait for <name>.done before processing <name>;
                                          # the marker is deleted after success (DESIGN §4.4)

  [[folder.action]]
  type        = "copy"
  destination = "/data/outbound/a"        # must be outside `path`
  collision   = "suffix"                  # suffix | skip | fail

# ---------------------------------------------------------------------------
# Folder 2: recursive drop area, files MOVED to staging (tree preserved),
# large files so start/end hashing is off (destination is still verified),
# manifests OFF to reduce volume.
# ---------------------------------------------------------------------------
[[folder]]
id             = "bulk-drop"
enabled        = false
path           = "/data/inbound/bulk"
recursive      = true
settle_seconds = 600
verify_hash    = false
manifest       = false
include        = ["*"]
exclude        = [".*", "*.part", "*.tmp"]
on_success     = "leave"                  # must be "leave" when the chain ends with a move action

  [[folder.action]]
  type          = "move"
  destination   = "/data/staging/bulk"
  collision     = "fail"
  preserve_tree = true                    # keep relative subdirectory structure
  mode          = "copy"                  # copy+verify+unlink (default) | rename (same-fs only; keeps SELinux label)

# ---------------------------------------------------------------------------
# Folder 3: folder batch. The whole folder settles (nothing added, changed or
# removed for settle_seconds), then ONE approved program runs for the batch
# (DESIGN §4.6, §6.4, ADR-0011). Needs the daemon (monfile.service).
# The program must be root-owned and not group/world-writable, in root-owned
# directories. It runs as the service account, inside the service's sandbox
# (see /opt/monfile/docs/examples/command-sandbox.conf if it needs more).
# ---------------------------------------------------------------------------
[[folder]]
id             = "wsus-xfer"
enabled        = false
path           = "/data/wsus/in"
trigger        = "folder"                 # file (default) | folder
recursive      = true
settle_seconds = 900                      # quiet window for the WHOLE folder; longer than any sender pause
hash_batch     = true                     # hash every file once before the run, for the audit record
manifest       = true                     # one manifest per run
# Not allowed with trigger = "folder": ready_marker, processed_dir, skip_empty, verify_hash = true,
# on_success other than "leave", or any action other than a single "command".

  [[folder.action]]
  type            = "command"
  program         = "/usr/local/libexec/wsus-xfer.sh"   # absolute; checked before every run
  args            = []                                  # fixed strings only; never file names
  timeout_seconds = 7200                                # SIGTERM, then SIGKILL 30 s later
  busy_exit_code  = 75                                  # optional: "already running, try again in 5 min"
  expect_empty    = true                                # success = exit 0 AND the folder is empty
  # The program gets MONFILE_FOLDER_ID, MONFILE_FOLDER_PATH, MONFILE_BATCH_ID, and
  # MONFILE_BATCH_LIST (a file of the batch's relative paths, NUL-terminated).
